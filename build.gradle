plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// JEI, only for the self-test (-PwithJei) to check that it lists the icons
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

sourceSets {
	selftest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

neoForge {
	version = project.neo_version
	// The 1.21.5+ NBT accessors the quest code uses (compat package): visible to the compiler, the mixins add them at run time.
	interfaceInjectionData.from(file("src/main/resources/META-INF/interfaces.json"))

	mods {
		questsicons {
			sourceSet sourceSets.main
		}
		questsicons_selftest {
			sourceSet sourceSets.selftest
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
		// Visual self-test (dev only, never shipped): ./gradlew runSelftest
		// Clicks through the quest book and the editor in a fresh world, imports an FTB Quests book (also on a dedicated
		// server started in the same JVM) and saves screenshots (src/selftest; a small harness with the names of Fabric's
		// client game-test API). Run it under Xvfb.
		selftest {
			client()
			sourceSet = sourceSets.selftest
			loadedMods = [mods.questsicons, mods.questsicons_selftest]
			gameDirectory = file("build/run/selftest")
			systemProperty "qi.selftest", "true"
			jvmArgument "-Xmx2G"
			programArguments.addAll("--username", "QiTester", "--width", "1280", "--height", "720")
			// The FTB Quests book the self-test imports: -PselftestFtb=/path/to/quests (default: the JSON5 test book).
			systemProperty "qi.selftestFtb", (project.findProperty("selftestFtb") ?: file("src/test/resources/ftbquests/json5").absolutePath).toString()
			// The book imported on the in-process dedicated server (-PselftestFtbLarge=..., default: the same book).
			if (project.findProperty("selftestFtbLarge")) systemProperty "qi.selftestFtbLarge", project.findProperty("selftestFtbLarge").toString()
			// Splits payloads above this many bytes into parts (QuestNet), to test the parts with a small book: -PselftestMaxPayload=4000
			if (project.findProperty("selftestMaxPayload")) systemProperty "questsicons.maxPayload", project.findProperty("selftestMaxPayload").toString()
		}
	}

	// Converter tests run inside NeoForge (FML's JUnit support), so the compat mixins are applied to Minecraft.
	unitTest {
		enable()
		testedMod = mods.questsicons
	}
}

dependencies {
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	if (project.hasProperty("withJei")) {
		selftestRuntimeOnly "maven.modrinth:jei:${project.property('withJei')}"
	}
}

// Converter tests (FTB Quests import): ./gradlew test
// Real modpack quest folders are not part of the repo (their authors keep the rights): fetch six public ones with
// "python3 -I tools/ftb_samples.py fetch <dir>" and run ./gradlew test -PftbSamples=<dir> (one sub-folder per pack;
// <name>.stats.json holds the counts of an independent reader that the tests compare with).
test {
	useJUnitPlatform()
	maxHeapSize = "2G"
	systemProperty "qi.ftbSamples", project.findProperty("ftbSamples") ?: ""
	systemProperty "qi.testOut", layout.buildDirectory.dir("test-import").get().asFile.absolutePath
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [mod_version: project.mod_version, minecraft_version: project.minecraft_version, neo_version: project.neo_version]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// A clean game for every self-test: no onboarding screens, no pause when the window loses focus.
tasks.matching { it.name == "runSelftest" }.configureEach {
	doFirst {
		def dir = file("build/run/selftest")
		dir.mkdirs()
		file("build/run/selftest/options.txt").text = "onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\n" +
				"joinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\nsoundCategory_master:0.0\n"
		delete "build/run/selftest/saves", "build/run/selftest/world", "build/run/selftest/config/questsicons", "build/run/selftest/screenshots"
	}
}
