plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 is obfuscated: official Mojang names, so the code reads like the 26.x branches.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	// Runs the tests inside Fabric Loader, so the compat mixins (1.21.5+ NBT accessors) are applied to Minecraft.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Converter tests (FTB Quests import): ./gradlew test
// Real modpack quest folders are not part of the repo (their authors keep the rights): fetch six public ones with
// "python3 -I tools/ftb_samples.py fetch <dir>" and run ./gradlew test -PftbSamples=<dir> (one sub-folder per pack;
// <name>.stats.json holds the counts of an independent reader that the tests compare with).
test {
	useJUnitPlatform()
	maxHeapSize = "2G"
	// Minecraft writes logs/ into the working directory: keep it out of the repository.
	workingDir = layout.buildDirectory.dir("test-run").get().asFile
	doFirst { workingDir.mkdirs() }
	systemProperty "qi.ftbSamples", project.findProperty("ftbSamples") ?: ""
	systemProperty "qi.testOut", layout.buildDirectory.dir("test-import").get().asFile.absolutePath
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// Visual self-test (dev only, never shipped): ./gradlew runSelftest
// Clicks through the quest book and the editor in a fresh world, imports an FTB Quests book (also on a dedicated server
// started in the same JVM) and saves screenshots. Minecraft 1.21.1 has no Fabric client game-test API yet: src/selftest
// brings a small harness with the same names (net.kasax.questsicons.selftest.harness). Run it under Xvfb.
sourceSets {
	selftest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		"questsicons" {
			sourceSet sourceSets.main
		}
		"questsicons-selftest" {
			sourceSet sourceSets.selftest
		}
	}
	runs {
		selftest {
			client()
			name "Selftest"
			source sourceSets.selftest
			runDir "build/run/selftest"
			property "qi.selftest", "true"
			vmArg "-Xmx2G"
			programArgs "--username", "QiTester", "--width", "1280", "--height", "720"
			// The FTB Quests book the self-test imports: -PselftestFtb=/path/to/quests (default: the JSON5 test book).
			vmArg "-Dqi.selftestFtb=" + (project.findProperty("selftestFtb") ?: file("src/test/resources/ftbquests/json5").absolutePath)
			// The book imported on the in-process dedicated server (-PselftestFtbLarge=..., default: the same book).
			if (project.findProperty("selftestFtbLarge")) vmArg "-Dqi.selftestFtbLarge=" + project.findProperty("selftestFtbLarge")
			// Splits payloads above this many bytes into parts (QuestNet), to test the parts with a small book: -PselftestMaxPayload=4000
			if (project.findProperty("selftestMaxPayload")) vmArg "-Dquestsicons.maxPayload=" + project.findProperty("selftestMaxPayload")
		}
	}
}
// The game runs on Java 21 like a 1.21.1 player's (Gradle itself may run on a newer JDK).
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// A clean game for every self-test: no onboarding screens, no pause when the window loses focus.
tasks.matching { it.name == "runSelftest" }.configureEach {
	doFirst {
		def dir = file("build/run/selftest")
		dir.mkdirs()
		file("build/run/selftest/options.txt").text = "onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\n" +
				"joinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\nsoundCategory_master:0.0\n"
		delete "build/run/selftest/saves", "build/run/selftest/world", "build/run/selftest/config/questsicons", "build/run/selftest/screenshots"
	}
}
